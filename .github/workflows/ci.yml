name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: ops-ticket-api
  DATABASE_URL_B64: cG9zdGdyZXNxbDovL29wc19hcHA6ZGV2LXNlY3JldC1jaGFuZ2UtbWVAbGIuZXhhbXBsZS5pbnRlcm5hbDo1NDMyL29wc190aWNrZXRz

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci --omit=dev

      - run: npm run lint

  test:
    name: Test And Readiness
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm test

      - name: Write env file
        run: echo "$DATABASE_URL_B64" | base64 -d > .env

      - run: npm run check:ready

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

  scan:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: "HIGH,CRITICAL"
          exit-code: "1"
